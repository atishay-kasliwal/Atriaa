name: Atria landing

on:
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atria-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    # Enable only after adding a scoped Cloudflare API token and confirming the account.
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: landing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run db:remote
      - run: npm run deploy
