name: Atria application

on:
  pull_request:
    paths: ['er-priority/frontend/**', 'backend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['er-priority/frontend/**', 'backend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atria-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: er-priority/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: er-priority/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r ../../backend/requirements-dev.txt
      - run: python -m pytest -q ../../backend/tests/test_live.py
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # Starts a production Next.js build and an isolated in-memory API.
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: er-priority/frontend/test-results/
          retention-days: 7
