# DigitalOcean App Platform spec. Create with:
#   doctl apps create --spec .do/app.yaml
# One container serves the API and frontend/index.html at /.
# Then set the SECRET values in the DO dashboard (never commit them here).
name: atria
region: nyc
services:
  - name: api
    github:
      repo: atishay-kasliwal/Atriaa
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-3.5-flash
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: digitalocean
